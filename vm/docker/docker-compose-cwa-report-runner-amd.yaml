services:
  cwa-report-runner:
    image: ${IMAGE_REGISTRY_GHCR:-ghcr.io}/crusoecloud/crusoe-watch-agent-v2/report-runner-amd:${REPORT_RUNNER_VERSION}
    container_name: cwa-report-runner
    hostname: cwa-report-runner
    # rocm_techsupport.sh needs GPU access plus host diagnostics.
    # Scoped caps + explicit device access avoid privileged: true.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYSLOG]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    pids_limit: 1024
    mem_limit: 2g
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      # Shared with cwa-manager: the runner writes the archive here and the manager reads + uploads it.
      - /etc/crusoe/bug-reports:/etc/crusoe/bug-reports
      # dmidecode reads the DMI tables from sysfs.
      - /sys/firmware/dmi:/sys/firmware/dmi:ro
      # VM: prefer the host's driver-matched ROCm over the image's bundled fallback.
      - /opt/rocm:/opt/rocm:ro
      # Host install/config state read by rocm_techsupport.sh (read-only).
      - /var/lib/dpkg:/var/lib/dpkg:ro        # dpkg -l: amdgpu-dkms / ROCm packages
      - /lib/modules:/lib/modules:ro          # modinfo amdgpu
      - /var/lib/dkms:/var/lib/dkms:ro        # dkms status
      - /boot:/boot:ro                        # lsinitramfs
      - /var/log/journal:/var/log/journal:ro  # journalctl -b -1/-2/-3 (needs host persistent journald)
    environment:
      # Pin the script to the host-mounted ROCm instead of auto-detecting the bundled copy.
      - ROCM_VERSION=/opt/rocm
    restart: always
