services:
  cwa-vector:
    image: ${IMAGE_REGISTRY_GHCR:-ghcr.io}/vectordotdev/vector:${VECTOR_VERSION}-debian
    container_name: cwa-vector
    hostname: cwa-vector
    volumes:
      - /etc/crusoe/shared:/etc/vector:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/lib/vector:/var/lib/vector
    env_file:
      - /etc/crusoe/crusoe_watch_agent/.env
      - /etc/crusoe/secrets/.monitoring-token
    environment:
      - PROCFS_ROOT=/host/proc
      - SYSFS_ROOT=/host/sys
    cap_drop: [ALL]
    # Journal files are 0640 root:systemd-journal.
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    entrypoint: /bin/sh -c "sleep 5 && /usr/bin/vector --config /etc/vector/vector.yaml --watch-config"
    # Scrapes the exporters on host loopback, which is what lets them bind 127.0.0.1.
    network_mode: host
    restart: always
