services:
  cwa-manager:
    image: ghcr.io/crusoecloud/crusoe-watch-agent-v2/cwa-manager:${CWA_MANAGER_VERSION}
    container_name: cwa-manager
    hostname: cwa-manager
    volumes:
      - /sys/class/dmi/id:/sys/class/dmi/id:ro
      - /etc/crusoe:/etc/crusoe
    env_file:
      - /etc/crusoe/crusoe_watch_agent/.env
      - /etc/crusoe/secrets/.monitoring-token
    network_mode: host
    restart: always
    # Must exceed the heartbeat shutdown budget (internal/heartbeat/heartbeat.go).
    stop_grace_period: 30s
