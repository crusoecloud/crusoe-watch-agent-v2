services:
  crusoe-metrics-exporter:
    image: ${IMAGE_REGISTRY_GHCR:-ghcr.io}/crusoecloud/crusoe-metrics-exporter/crusoe-metrics-exporter:${CME_VERSION}
    container_name: crusoe-metrics-exporter
    hostname: crusoe-metrics-exporter
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    env_file:
      - /etc/crusoe/crusoe_watch_agent/.env
      - /etc/crusoe/secrets/.monitoring-token
    environment:
      - PORT=${CRUSOE_METRICS_EXPORTER_PORT:-9500}
      - DISKSTATS_PATH=/proc/diskstats
      - MOUNTSTATS_PATH=/host/proc/1/mountstats
      - OBJSTORE_ENDPOINT_FQDN=${OBJSTORE_ENDPOINT_FQDN:-}
    ports:
      # Loopback only: Vector scrapes this from the same host.
      - "127.0.0.1:${CRUSOE_METRICS_EXPORTER_PORT:-9500}:${CRUSOE_METRICS_EXPORTER_PORT:-9500}"
    privileged: true  # Needed for statfs via /host/proc/1/root (AppArmor ptrace).
    restart: always
