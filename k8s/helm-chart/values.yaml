namespace: crusoe-system

# Settings shared across the chart's images.
global:
  # global.registry -- Where container images are pulled from: ghcr (default) or ccr.
  registry: ghcr

  # global.region -- Crusoe region, e.g. "eu-iceland2-a". Auto-detected from the
  # topology.kubernetes.io/region node label; only set it for `helm template`
  # or --dry-run, which render without cluster access.
  region: ""

  # global.ccr -- Preconfigured CCR pull-through cache projects, keyed by region.
  ccr:
    endpointFormat: "registry.%s.ccr.crusoecloudcompute.com"
    projects:
      eu-iceland2-a:
        ghcr: "cwa-ghcr.33d1748b"
        dockerhub: "cwa-docker.33d1748b"

# Image pull secrets for private registries.
imagePullSecrets: []
# - name: gitlab-registry

# CMS monitoring backend URL.
cmsEndpoint: "https://cms-monitoring.crusoecloud.com"

# Pre-existing secret containing CRUSOE_CLUSTER_ID, CRUSOE_PROJECT_ID,
# and Crusoe API credentials (CRUSOE_ACCESS_KEY, CRUSOE_ACCESS_KEY_SECRET).
# Loaded via envFrom into the Vector and token-creation Job containers.
existingSecret: crusoe-secrets

# Token-creation Job — uses Crusoe CLI to create a monitoring token
# and stores it in a Kubernetes secret.
# TODO: manual IMDS endpoint to obtain a short-lived JWT; no manual monitoring token creation required
tokenJob:
  image: crusoecloud/crusoe-watch-agent/token-job
  tag: "@@TOKEN_JOB_VERSION@@"
  ttlSecondsAfterFinished: 300

vector:
  image: vectordotdev/vector
  tag: "@@VECTOR_VERSION@@-debian"

cwaManager:
  image: crusoecloud/crusoe-watch-agent-v2/cwa-manager
  tag: "@@CWA_MANAGER_VERSION@@"
  # Health endpoint cwa-updater polls per pod after an upgrade, fronted by the
  # headless Service.
  healthPort: 8787

# cwa-updater address. Deployed by the separate `cwa-updater` chart, so it is
# addressed by DNS rather than localhost. host defaults to
# cwa-updater.<namespace>.svc.cluster.local.
cwaUpdater:
  host: ""
  port: 8786

# Resource requests/limits.
resources:
  vector:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  cwaManager:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  cme:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Exporter toggles — override cwa-manager defaults via env vars.
dcgm:
  enabled: true
  port: 9400
  scrapeInterval: 30

amd:
  enabled: true
  port: 5000
  scrapeInterval: 60

ksm:
  enabled: true
  port: 8080
  telemetryPort: 8081
  scrapeInterval: 60

slurm:
  enabled: false
  port: 6817
  scrapeInterval: 60

cme:
  enabled: true
  port: 9500
  scrapeInterval: 60
  image: crusoecloud/crusoe-metrics-exporter/crusoe-metrics-exporter
  tag: "@@CRUSOE_METRICS_EXPORTER_VERSION@@"

customMetrics:
  enabled: true
  defaultPort: 9100
  defaultPath: "/metrics"
  defaultScrape: 30

logs:
  enabled: true
  # Deployment pods in these namespaces are collected; the DaemonSets, which log
  # once per node, are not. Both namespace names are listed so either NVIDIA
  # install layout matches. Empty disables operator log collection.
  operatorNamespaces:
    - nvidia-gpu-operator
    - gpu-operator
    - nvidia-network-operator
    - network-operator

# Bug-report (report.bug command) settings.
bugReport:
  driverNamespace: nvidia-gpu-operator
  socketHostPath: /var/lib/cwa/bug-reports

# report-runner: the agent-owned bug-report collector for bundled-driver GPU nodes.
reportRunner:
  nvidia:
    # Enable on bundled-NVIDIA (GB200/GB300) nodes.
    enabled: true
    image: crusoecloud/crusoe-watch-agent-v2/report-runner
    tag: "@@REPORT_RUNNER_VERSION@@"
    # Render nodeAffinity In on SKUs with driver on host.
    instanceTypes:
      - gb200-186gb-nvl-ib.4x
      - gb200-186gb-nvl.4x
      - gb300-288gb-nvl-ib.4x
      - gb300-288gb-nvl.4x
  amd:
    enabled: true
    image: crusoecloud/crusoe-watch-agent-v2/report-runner-amd
    tag: "@@REPORT_RUNNER_VERSION@@"
    nodeSelector:
      feature.node.kubernetes.io/amd-gpu: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 2Gi

# Covers crusoe-metrics-exporter and report-runner; see
# templates/networkpolicy.yaml.
networkPolicy:
  enabled: true
  # Namespace-wide baseline.
  defaultDeny:
    ingress: true
    egress: false
  # Scrape and kubelet probe sources for crusoe-metrics-exporter. Leave empty
  # unless the CNI filters host traffic to local pods.
  nodeCIDRs: []

# Proxy settings (optional).
proxy:
  enabled: false
  http: ""
  https: ""
  noProxy: ""

# Tolerations — default runs on all nodes.
tolerations:
  - operator: Exists
