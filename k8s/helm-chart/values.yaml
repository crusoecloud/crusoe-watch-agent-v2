namespace: crusoe-system

# Image pull secrets for private registries.
imagePullSecrets: []
# - name: gitlab-registry

# CMS monitoring backend URL.
cmsEndpoint: "https://cms-monitoring.crusoecloud.com"

# Pre-existing secret containing CRUSOE_CLUSTER_ID, CRUSOE_PROJECT_ID,
# and Crusoe API credentials (CRUSOE_ACCESS_KEY, CRUSOE_ACCESS_KEY_SECRET).
# Loaded via envFrom into the Vector and token-creation Job containers.
existingSecret: crusoe-secrets

# Token-creation Job — uses Crusoe CLI to create a monitoring token
# and stores it in a Kubernetes secret.
# TODO: manual IMDS endpoint to obtain a short-lived JWT; no manual monitoring token creation required
tokenJob:
  image: ghcr.io/crusoecloud/crusoe-watch-agent/token-job
  tag: v0.2.12
  ttlSecondsAfterFinished: 300

# Container images.
vector:
  image: timberio/vector
  tag: "0.55.0-debian"

cwaManager:
  image: ghcr.io/crusoecloud/crusoe-watch-agent/cwa-manager
  tag: latest

# Resource requests/limits.
resources:
  vector:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  cwaManager:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Exporter toggles — override cwa-manager defaults via env vars.
dcgm:
  enabled: true
  port: 9400
  scrapeInterval: 30

amd:
  enabled: true
  port: 5000
  scrapeInterval: 60

ksm:
  enabled: true
  port: 8080
  scrapeInterval: 60

slurm:
  enabled: false
  port: 6817
  scrapeInterval: 60

cme:
  enabled: true
  port: 9500
  scrapeInterval: 60

customMetrics:
  enabled: true
  defaultPort: 9100
  defaultPath: "/metrics"
  defaultScrape: 30

logs:
  enabled: true

# Proxy settings (optional).
proxy:
  enabled: false
  http: ""
  https: ""
  noProxy: ""

# Tolerations — default runs on all nodes.
tolerations:
  - operator: Exists
