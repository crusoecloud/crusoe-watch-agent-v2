apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cwa.fullname" . }}-token-job
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
  annotations:
    # One-time bootstrap, so it runs as an install hook and stays out of the release manifest.
    "helm.sh/hook": post-install
    # Makes a re-install idempotent instead of failing on a surviving Job.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.tokenJob.ttlSecondsAfterFinished }}
  template:
    spec:
      serviceAccountName: {{ include "cwa.fullname" . }}-token-job
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crusoe-token-creator
          image: {{ include "cwa.image" (dict "ctx" $ "upstream" "ghcr" "repository" .Values.tokenJob.image "tag" .Values.tokenJob.tag) | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CRUSOE_NAMESPACE
              value: {{ .Values.namespace }}
            - name: CRUSOE_MONITORING_TOKEN_SECRET_NAME
              value: {{ include "cwa.monitoringSecretName" . }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
