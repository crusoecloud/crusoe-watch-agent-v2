{{- if and .Values.cmkv2Cp.enabled .Values.cmkv2Cp.externalSecret.enabled }}
# Vault -> Secret sync for the per-cell CP log token. Write the token to Vault at
# secret/<release-namespace>/<logTokenSecret> (property: token). Enable only where cml-vector
# does not already provide this secret (every cell except icat-6).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.cmkv2Cp.externalSecret.secretStoreName }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ .Values.cmkv2Cp.externalSecret.vault.server | quote }}
      path: {{ .Values.cmkv2Cp.externalSecret.vault.path | quote }}
      version: {{ .Values.cmkv2Cp.externalSecret.vault.version | quote }}
      caProvider:
        type: Secret
        name: {{ .Values.cmkv2Cp.externalSecret.vault.caProviderSecret | quote }}
        namespace: {{ .Release.Namespace }}
        key: ca.crt
      auth:
        kubernetes:
          mountPath: {{ .Values.cmkv2Cp.externalSecret.vault.mountPath | quote }}
          role: {{ .Values.cmkv2Cp.externalSecret.vault.role | quote }}
          serviceAccountRef:
            name: {{ include "cwa.serviceAccountName" . | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cmkv2Cp.logTokenSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ .Values.cmkv2Cp.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.cmkv2Cp.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.cmkv2Cp.logTokenSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.cmkv2Cp.logTokenKey }}
      remoteRef:
        key: {{ printf "%s/%s" .Release.Namespace .Values.cmkv2Cp.logTokenSecret | quote }}
        property: token
{{- end }}
