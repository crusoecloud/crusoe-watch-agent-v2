apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cwa.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cwa.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cwa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cwa.selectorLabels" . | nindent 8 }}
        # Separates agent pods from report-runner pods, which share the selector
        # labels. The headless Service selects on this.
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "cwa.serviceAccountName" . }}
      automountServiceAccountToken: true
      hostNetwork: true
      # Required with hostNetwork: the node's resolver can't resolve
      # cwa-updater.<ns>.svc.cluster.local.
      dnsPolicy: ClusterFirstWithHostNet
      # 35 - 5s preStop = 30s SIGTERM grace; must exceed the heartbeat shutdown budget (heartbeat.go).
      terminationGracePeriodSeconds: 35
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      containers:
        # --- Vector ---
        - name: vector
          image: {{ include "cwa.image" (dict "ctx" $ "upstream" "ghcr" "repository" .Values.vector.image "tag" .Values.vector.tag) | quote }}
          command:
            - /bin/sh
            - -c
            - |
              export VM_ID=$(cat /host/sys/class/dmi/id/product_uuid 2>/dev/null || echo "unknown")
              # Wait for cwa-manager to write the initial config.
              echo "Waiting for Vector config..."
              while [ ! -f /etc/vector/vector.yaml ]; do sleep 1; done
              echo "Config found, starting Vector."
              exec /usr/bin/vector --config /etc/vector/vector.yaml --watch-config
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CRUSOE_MONITORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.monitoringSecretName" . }}
                  key: CRUSOE_MONITORING_TOKEN
            - name: AGENT_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: VECTOR_VERSION
              value: {{ .Values.vector.tag | quote }}
            - name: INSTALL_TYPE
              value: "kubernetes"
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          volumeMounts:
            - name: crusoe-shared
              mountPath: /etc/vector
            - name: vector-data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib
              mountPath: /var/lib
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: journal-logs
              mountPath: /var/log/journal
              readOnly: true
          resources:
            {{- toYaml .Values.resources.vector | nindent 12 }}
          securityContext:
            privileged: true

        # --- cwa-manager ---
        - name: cwa-manager
          image: {{ include "cwa.image" (dict "ctx" $ "upstream" "ghcr" "repository" .Values.cwaManager.image "tag" .Values.cwaManager.tag) | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.cwaManager.healthPort }}
              protocol: TCP
          lifecycle:
            # Delay SIGTERM so the shutdown handler doesn't race kubelet teardown.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: CWA_STATE_DIR
              value: /var/lib/cwa-manager
            - name: CWA_HEALTH_PORT
              value: {{ .Values.cwaManager.healthPort | quote }}
            - name: CWA_UPDATER_HOST
              value: {{ .Values.cwaUpdater.host | default (printf "cwa-updater.%s.svc.cluster.local" .Values.namespace) | quote }}
            - name: CWA_UPDATER_PORT
              value: {{ .Values.cwaUpdater.port | quote }}
            - name: CRUSOE_MONITORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cwa.monitoringSecretName" . }}
                  key: CRUSOE_MONITORING_TOKEN
            - name: CMS_ENDPOINT
              value: {{ .Values.cmsEndpoint | quote }}
            - name: VECTOR_CONFIG_PATH
              value: /etc/crusoe/shared/vector.yaml
            - name: DCGM_ENABLED
              value: {{ .Values.dcgm.enabled | quote }}
            - name: DCGM_PORT
              value: {{ .Values.dcgm.port | quote }}
            - name: DCGM_SCRAPE_INTERVAL
              value: {{ .Values.dcgm.scrapeInterval | quote }}
            - name: AMD_ENABLED
              value: {{ .Values.amd.enabled | quote }}
            - name: AMD_PORT
              value: {{ .Values.amd.port | quote }}
            - name: AMD_SCRAPE_INTERVAL
              value: {{ .Values.amd.scrapeInterval | quote }}
            - name: KSM_ENABLED
              value: {{ .Values.ksm.enabled | quote }}
            - name: KSM_PORT
              value: {{ .Values.ksm.port | quote }}
            - name: KSM_SCRAPE_INTERVAL
              value: {{ .Values.ksm.scrapeInterval | quote }}
            - name: SLURM_ENABLED
              value: {{ .Values.slurm.enabled | quote }}
            - name: SLURM_PORT
              value: {{ .Values.slurm.port | quote }}
            - name: SLURM_SCRAPE_INTERVAL
              value: {{ .Values.slurm.scrapeInterval | quote }}
            - name: CME_ENABLED
              value: {{ .Values.cme.enabled | quote }}
            - name: CME_PORT
              value: {{ .Values.cme.port | quote }}
            - name: CME_SCRAPE_INTERVAL
              value: {{ .Values.cme.scrapeInterval | quote }}
            - name: CUSTOM_METRICS_ENABLED
              value: {{ .Values.customMetrics.enabled | quote }}
            - name: CUSTOM_METRICS_DEFAULT_PORT
              value: {{ .Values.customMetrics.defaultPort | quote }}
            - name: CUSTOM_METRICS_DEFAULT_PATH
              value: {{ .Values.customMetrics.defaultPath | quote }}
            - name: CUSTOM_METRICS_DEFAULT_SCRAPE
              value: {{ .Values.customMetrics.defaultScrape | quote }}
            - name: LOGS_ENABLED
              value: {{ .Values.logs.enabled | quote }}
            - name: NVIDIA_DRIVER_NAMESPACE
              value: {{ .Values.bugReport.driverNamespace | quote }}
            {{- if .Values.proxy.enabled }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.http | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.https | quote }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: crusoe-shared
              mountPath: /etc/crusoe/shared
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            # Host os-release: /etc/os-release inside the container describes the image.
            - name: host-os-release
              mountPath: /host/etc/os-release
              readOnly: true
            - name: cwa-state
              mountPath: /var/lib/cwa-manager
            # Shared with the report-runner DaemonSet on bundled-driver GPU nodes: the
            # runner writes the socket + archive here, cwa-manager dials it and uploads.
            - name: bug-report-shared
              mountPath: {{ .Values.bugReport.socketMountPath | default "/etc/crusoe/bug-reports" }}
          resources:
            {{- toYaml .Values.resources.cwaManager | nindent 12 }}

      volumes:
        - name: crusoe-shared
          emptyDir: {}
        - name: vector-data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: var-lib
          hostPath:
            path: /var/lib
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-os-release
          hostPath:
            path: /etc/os-release
            type: File
        - name: journal-logs
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        # Persistent state for the last-applied control-plane config
        # (survives pod restarts, not node reimage).
        - name: cwa-state
          hostPath:
            path: /var/lib/cwa-manager
            type: DirectoryOrCreate
        # Shared with the report-runner DaemonSet (bundled-driver GPU nodes) for the
        # bug-report socket and archive. Empty/unused on GPU Operator and CPU nodes.
        - name: bug-report-shared
          hostPath:
            path: {{ .Values.bugReport.socketHostPath }}
            type: DirectoryOrCreate
