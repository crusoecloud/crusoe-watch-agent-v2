apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cwa.fullname" . }}
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
rules:
  # kubernetes_logs: list+watch on pods, nodes, namespaces.
  # cwa-manager: get nodes, list+watch pods.
  # Ref: https://vector.dev/docs/reference/configuration/sources/kubernetes_logs/#kubernetes-api-access-control
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cwa.fullname" . }}
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cwa.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cwa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
---
# --- Token-creation Job RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cwa.fullname" . }}-token-job
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cwa.fullname" . }}-token-job
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cwa.fullname" . }}-token-job
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cwa.fullname" . }}-token-job
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "cwa.fullname" . }}-token-job
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Namespace
metadata:
  name: crusoe-monitoring
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
---
# Role for reading custom-metrics ConfigMap in crusoe-monitoring namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cwa.fullname" . }}-configmap-reader
  namespace: crusoe-monitoring
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cwa.fullname" . }}-configmap-reader
  namespace: crusoe-monitoring
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cwa.fullname" . }}-configmap-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cwa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
---
{{- if lookup "v1" "Namespace" "" .Values.bugReport.driverNamespace }}
# Exec into the GPU Operator driver pod to run nvidia-bug-report.sh (report.bug).
# NVIDIA-only and scoped to the driver namespace — least privilege for pods/exec.
# Rendered only when the driver namespace exists. On AMD, it is absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cwa.fullname" . }}-driver-exec
  namespace: {{ .Values.bugReport.driverNamespace }}
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cwa.fullname" . }}-driver-exec
  namespace: {{ .Values.bugReport.driverNamespace }}
  labels:
    {{- include "cwa.bootstrapLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cwa.fullname" . }}-driver-exec
subjects:
  - kind: ServiceAccount
    name: {{ include "cwa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
