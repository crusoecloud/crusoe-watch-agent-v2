{{- if .Values.cme.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crusoe-metrics-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: crusoe-metrics-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crusoe-metrics-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: crusoe-metrics-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crusoe-metrics-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crusoe-metrics-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostPID: true
      serviceAccountName: crusoe-metrics-exporter
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: crusoe-metrics-exporter
          image: {{ include "cwa.image" (dict "ctx" $ "upstream" "ghcr" "repository" .Values.cme.image "tag" .Values.cme.tag) | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.cme.port }}
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PORT
              value: {{ .Values.cme.port | quote }}
            - name: DISKSTATS_PATH
              value: "/host/proc/diskstats"
            - name: MOUNTSTATS_PATH
              value: "/host/proc/1/mountstats"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            # Kernel log stream for the soft-lockup collector (CME >= 0.2.7).
            # CAP_SYSLOG (needed to read /dev/kmsg) is already granted by privileged: true below.
            - name: dev-kmsg
              mountPath: /dev/kmsg
              readOnly: true
          resources:
            {{- toYaml .Values.resources.cme | nindent 12 }}
          securityContext:
            privileged: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: dev-kmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice
{{- end }}
