{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cwaUpdater.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cwaUpdater.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cwaUpdater.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Upgrade handoff.
    - ports:
        - port: {{ .Values.cwaUpdater.port }}
          protocol: TCP
  egress:
    - ports:
        # DNS.
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        # Per-pod agent health polling.
        - port: {{ .Values.agent.healthPort }}
          protocol: TCP
        # apiserver, OCI chart pull, cosign.
        {{- range $np.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
