{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cwaUpdater.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cwaUpdater.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cwaUpdater.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Upgrade handoff. On Cilium the CiliumNetworkPolicy admits the agent nodes.
  {{- if include "cwaUpdater.cilium" . }}
  ingress: []
  {{- else }}
  ingress:
    - ports:
        - port: {{ .Values.cwaUpdater.port }}
          protocol: TCP
  {{- end }}
  egress:
    - ports:
        # DNS.
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        # Per-pod agent health polling.
        - port: {{ .Values.agent.healthPort }}
          protocol: TCP
        # apiserver, OCI chart pull, cosign.
        {{- range $np.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- if include "cwaUpdater.cilium" . }}
---
# Admits the agent pods, which use hostNetwork, by entity rather than by IP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "cwaUpdater.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cwaUpdater.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "cwaUpdater.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ .Values.cwaUpdater.port | quote }}
              protocol: TCP
{{- end }}
{{- end }}
