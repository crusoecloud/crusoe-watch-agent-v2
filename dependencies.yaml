# dependencies.yaml — source of truth for component versions.
#
# Every component shipped by either delivery mode (VM installer / Helm chart)
# is pinned here. The release pipeline reads this file AT THE TAGGED COMMIT
# and substitutes the values into the templated install sources.

###############################################################################
# Internal components.
###############################################################################

# cwa-manager: VM agent + K8s sidecar. Built from root Dockerfile.
# Tag format: YYYY.MM.DD-<short-sha>.
cwa-manager: "2026.10.29-8a9d0287"

# cwa-updater: upgrade executor. K8s: single-replica Deployment (cwa-updater chart).
# Tag format: YYYY.MM.DD-<short-sha>.
cwa-updater: "2026.10.27-a7371ad2"

# report-runner: docker-mode bug-report sidecar (NVIDIA + AMD images share this pin).
# Tag format: YYYY.MM.DD-<short-sha>.
report-runner: "2026.10.29-8a9d0287"

###############################################################################
# External components — upstream/vendored versions.
###############################################################################

# token-job: K8s Job that mints a monitoring token via the Crusoe CLI.
token-job: "v0.2.35"

# Vector: log/metric forwarder. Used by both VM (docker + native) and K8s.
# Docker tag suffix `-debian` is appended at render time only where needed.
vector: "0.55.0"

# crusoe-metrics-exporter: object-store metrics for VM (docker + native).
crusoe-metrics-exporter: "0.2.9"

# dcgm-exporter upstream release, as <DCGM version>-<exporter version>.
dcgm-exporter-release: "4.6.1-4.8.4"

# AMD device-metrics-exporter (docker only).
amd-exporter: "v1.5.0"
