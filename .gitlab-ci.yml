include:
  - project: 'crusoeenergy/tools'
    file: '/templates/go.gitlab-ci.yml'
  - template: Security/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST-IaC.latest.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  # Flow A: per-component image builds (Docker images tagged :YYYY.MM.DD-sha,
  # published to the internal GitLab Container Registry, no :latest).
  - local: 'ci/components.gitlab-ci.yml'
  # Manual, tag-anchored release jobs. One per independently released artifact
  # (vm script, agent chart, cwa-updater chart); they share
  # ci/scripts/release.sh as the orchestrator.
  - local: 'ci/release-vm.gitlab-ci.yml'
  - local: 'ci/release-k8s.gitlab-ci.yml'
  - local: 'ci/release-updater.gitlab-ci.yml'

# Pipeline stages. Builds (per-component images) run continuously; the manual
# release job lives in a later stage so a `release:*` button only appears
# after builds are green for the pipeline's commit.
stages:
  - test
  - build
  - release

lint:mr:
  stage: .pre
  image: alpine:3.19
  script:
    - |
      echo "MR title: $CI_MERGE_REQUEST_TITLE"
      if ! echo "$CI_MERGE_REQUEST_TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf): .+'; then
        echo "ERROR: MR title must match '<type>: <description>'"
        echo "Valid types: feat, fix, chore, docs, refactor, test, ci, perf"
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Static analysis for the VM installer script. Scoped to crusoe_watch_agent.sh.
shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:v0.11.0
  script:
    - shellcheck --version
    - shellcheck vm/crusoe_watch_agent.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - vm/crusoe_watch_agent.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - vm/crusoe_watch_agent.sh
        - .gitlab-ci.yml

variables:
  TAG_PREFIX: ""
  CI_IMAGE: "registry.gitlab.com/crusoeenergy/tools/go-ci-1.26"
  CI_IMAGE_TAG: "master"
  # Pinned cosign for the release and image-build jobs — see .install-cosign.
  COSIGN_VERSION: "v2.6.5"

# Installs the pinned cosign. Release and build runners are amd64. To check the
# binary by hand, compare sha256sum against cosign_checksums.txt on the release page:
#   https://github.com/sigstore/cosign/releases/tag/${COSIGN_VERSION}
.install-cosign:
  script:
    - curl -fsSL -o /usr/local/bin/cosign
      "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - chmod +x /usr/local/bin/cosign
    - cosign version

# Hands the tag-push token to git as an Authorization header, and exports the
# push URL. A header goes out on the first request; a credential helper is only
# consulted after a 401, and that path 403s here. Scoped to this repo.
.git-push-credentials:
  script:
    - export GIT_PUSH_URL="https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      umask 077
      : >> "${HOME}/.gitconfig"
      chmod 600 "${HOME}/.gitconfig"
      basic=$(printf 'ci-push-token:%s' \
          "${REPO_ACCESS_TOKEN:?REPO_ACCESS_TOKEN required}" | base64 | tr -d '\n')
      printf '[http "%s"]\n\textraHeader = "Authorization: Basic %s"\n' \
          "$GIT_PUSH_URL" "$basic" >> "${HOME}/.gitconfig"
      unset basic
    # Confirm git resolves the header for the push URL.
    - |
      git config --get-urlmatch http.extraHeader "$GIT_PUSH_URL" > /dev/null \
          || { echo "push credential did not resolve for ${GIT_PUSH_URL}"; exit 1; }
    # A credential miss must fail the job rather than block on a password prompt.
    - export GIT_TERMINAL_PROMPT=0

# Renders the VM and K8s Vector config variants and runs `vector validate` on each.
vector:validate:
  stage: test
  image: ${CI_IMAGE}:${CI_IMAGE_TAG}
  before_script:
    - go env -w "GOPRIVATE=${CI_SERVER_HOST}"
    - echo -e "machine ${CI_SERVER_HOST} login gitlab-ci-token password ${CI_JOB_TOKEN}" > ~/.netrc
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - VECTOR_VERSION=$(grep '^vector:' dependencies.yaml | awk '{print $2}' | tr -d '"')
    # Vector from Datadog's apt repo, so apt verifies the package against the keyring.
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL -o /etc/apt/keyrings/vector.asc https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
    - echo "deb [signed-by=/etc/apt/keyrings/vector.asc] https://apt.vector.dev/ stable vector-0" > /etc/apt/sources.list.d/vector.list
    - apt-get update && apt-get install -y --no-install-recommends "vector=${VECTOR_VERSION}-1"
    - vector --version
  script:
    - make vector-validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - cmd/cwa-manager/**/*
        - internal/vector/**/*
        - ci/vector-config-dump/**/*
        - go.*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - .gitlab-ci.yml
        - cmd/cwa-manager/**/*
        - internal/vector/**/*
        - ci/vector-config-dump/**/*
        - go.*

# Lints and template-renders both Helm charts (agent + cwa-updater).
helm:lint:
  stage: test
  image: alpine/helm:3.16.2
  script:
    - |
      for c in helm-chart cwa-updater-chart; do
        cp -r "k8s/${c}" "/tmp/${c}"
        sed -i 's/@@CHART_VERSION@@/0.0.0-ci/; s/@@CHART_APP_VERSION@@/0.0.0-ci/' "/tmp/${c}/Chart.yaml"
        helm lint "/tmp/${c}"
        helm template ci-check "/tmp/${c}" >/dev/null
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - k8s/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - .gitlab-ci.yml
        - k8s/**/*

tag_semver:
  rules:
    - when: never

# Skip job on tag pipelines. The commit is already scanned on MR and main.
container_scanning:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: !reference [.code-changes, changes]
      exists:
        - Dockerfile
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
      exists:
        - Dockerfile

# Skip the shared template's image build on tag pipelines (vm/v2.x).
build_and_push:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - !reference [.build_and_push, rules]

code_intelligence:
  rules:
    - when: never

pages:
  extends: .pages
  image: ${CI_IMAGE}
  rules:
    - when: never
