  variables:
    IMAGE: "ghcr.io/crusoecloud/crusoe-watch-agent-v2/report-runner-amd"
    DOCKERFILE: cmd/report-runner/Dockerfile.amd
    PLATFORMS: "linux/amd64"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cmd/report-runner/**/*
        - internal/bugreport/**/*
        - internal/vector/**/*
        - internal/version/**/*
        - go.mod
