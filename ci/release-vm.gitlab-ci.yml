# Manual release job for the VM delivery mode.
#
# Triggered by clicking the job in the pipeline (when: manual). Renders from
# the chosen commit, signs the rendered installer script with cosign, and
# publishes a GitHub Release.
#
# Variables the operator can set when re-running ("Run pipeline" UI):
#   RELEASE_SHA  commit to release (default: pipeline's commit)
#   DRY_RUN      "true" to print what would happen without tagging/publishing
#
# Secrets that must exist as protected CI variables:
#   GHCR_USERNAME, GHCR_TOKEN        ghcr push + GitHub Release auth
#   COSIGN_PRIVATE_KEY_B64           cosign sign-blob signing key
#   REPO_ACCESS_TOKEN                tag push; scope to this project with
#                                    write_repository only, protected + masked

release:vm:
  stage: release
  image: golang:1.26-alpine
  resource_group: release-vm        # serialize: never two VM releases at once
  rules:
    # Manual button on main pipelines. Operators can also trigger via the
    # "Run pipeline" UI to override RELEASE_SHA/DRY_RUN.
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "web")'
      when: manual
      allow_failure: false
  variables:
    MODE: vm
    RELEASE_SHA: ""
    DRY_RUN: "false"
    GHCR_REGISTRY: "ghcr.io/crusoecloud/crusoe-watch-agent-v2"
    GITHUB_REPO: "crusoecloud/crusoe-watch-agent-v2"
  before_script:
    # Tools: git for tag push; openssl to verify the signature the way the
    # installer does; gh for the GitHub Release; jq for parsing. Go ships in
    # the base image. cosign is pinned separately (.install-cosign).
    - apk add --no-cache git bash curl jq github-cli openssl
    - !reference [.install-cosign, script]
    - git config --global user.name  "gitlab-ci"
    - git config --global user.email "gitlab-ci@crusoe.ai"
    # Sets GIT_PUSH_URL and the push credential.
    - !reference [.git-push-credentials, script]
    # Private Go modules (gitlab.com/crusoeenergy/*) — same pattern as Dockerfile.
    # GOPRIVATE resolves them over git, so this has to be git's own ~/.netrc.
    - |
      ( umask 077 && printf 'machine %s login gitlab-ci-token password %s\n' \
          "${CI_SERVER_HOST}" "${CI_JOB_TOKEN}" > ~/.netrc )
    - go env -w "GOPRIVATE=${CI_SERVER_HOST}"
    - git fetch --tags --quiet origin
  script:
    - ./ci/scripts/release.sh
